id: ecto
title: "Environmental conditions, treatments and exposures ontology"
github_org: EnvironmentOntology
repo: environmental-exposure-ontology
git_main_branch: master
use_dosdps: TRUE
export_formats:
  - owl
  - obo
  - json
import_group:
  use_base_merging: TRUE
  # Drop all individuals from the merged import (maps to ROBOT
  # `extract --individuals exclude`); ECTO is a class-level ontology and
  # imported individuals only add noise.
  slme_individuals: exclude
  # Foreign IRIs stripped from the merged import.
  # COB_* carries the atom/subatomic-particle disjointness that makes the
  # merged ontology inconsistent (issue #79); removing it lets ECTO build
  # without the disjoint-stripping workaround in ecto.Makefile.
  # The remaining prefixes are foreign scaffolding that base merging drags in
  # via the full FoodOn/UBERON/ENVO logical definitions; ECTO references none of
  # them directly, so they only add dangling, unlabelled classes.
  exclude_iri_patterns:
    - <http://purl.obolibrary.org/obo/COB_*>
    - <http://purl.obolibrary.org/obo/GOCHE_*>
    - <http://purl.obolibrary.org/obo/NCBITaxon_Union_*>
    - <http://purl.obolibrary.org/obo/CL_*>
    - <http://purl.obolibrary.org/obo/DRON_*>
    - <http://purl.obolibrary.org/obo/PO_*>
    - <http://purl.obolibrary.org/obo/BSPO_*>
    - <http://purl.obolibrary.org/obo/OBI_*>
    - <http://purl.obolibrary.org/obo/PR_*>
    - <http://purl.obolibrary.org/obo/PCO_*>
    - <http://purl.obolibrary.org/obo/UO_*>
    - <http://purl.obolibrary.org/obo/OMP_*>
    - <http://purl.obolibrary.org/obo/CDNO_*>
    - <http://purl.obolibrary.org/obo/GAZ_*>
    - <http://purl.obolibrary.org/obo/HANCESTRO_*>
    - <http://purl.obolibrary.org/obo/FAO_*>
    - <http://purl.obolibrary.org/obo/HP_*>
    - <http://purl.obolibrary.org/obo/OMRSE_*>
    - <http://purl.obolibrary.org/obo/IAO_0000027*>
    - <http://purl.obolibrary.org/obo/RO_0002310*>
    - <http://purl.obolibrary.org/obo/ENVO_00002002*>
    - <http://purl.obolibrary.org/obo/IAO_0000578*>
  products:
    - id: chebi
      make_base: TRUE
      mirror_from: http://purl.obolibrary.org/obo/upheno/chebi_slim.owl
    - id: envo
      use_base: TRUE
    - id: cob
      use_base: TRUE
    - id: bfo
      make_base: TRUE
    - id: exo
      make_base: TRUE
      base_iris:
        - http://purl.obolibrary.org/obo/ExO_
    - id: go
      # make_base (not use_base): the PURL for go-base.owl.gz redirects to GO's
      # server which returns 403 for the absent gzip, which odk-helper treats as
      # a hard error. go.owl.gz returns a clean 404, so make_base falls back fine.
      make_base: TRUE
    - id: maxo
      use_base: TRUE
    - id: foodon
      mirror_type: custom
    - id: nbo
      use_base: TRUE
    - id: opmi
      make_base: TRUE
    - id: omo
    - id: ncit
      mirror_from: https://raw.githubusercontent.com/ncit-obo-org/ncit-obo-edition/refs/heads/main/src/ontology/ncit-obo-slim.owl
      make_base: TRUE
    - id: ncbitaxon
      use_gzipped: TRUE
      is_large: TRUE
      make_base: TRUE
      base_iris:
        - http://purl.obolibrary.org/obo/NCBITaxon_
      mirror_from: http://purl.obolibrary.org/obo/ncbitaxon/subsets/taxslim.owl
    - id: pato
      use_base: TRUE
    - id: ro
      use_base: TRUE
    - id: uberon
      use_base: TRUE
    - id: xco
      make_base: TRUE
    # Re-enabled (was removed in dcbb8e4 over enpadasi/Ontology-for-Nutritional-Studies#33);
    # ECTO references ONS:1000038/1000039. make_base keeps only ONS-native axioms.
    - id: ons
      make_base: TRUE
robot_java_args: '-Xmx8G'
components:
  products:
    - filename: ecto-xrefs.owl
    - filename: bridge.owl
    - filename: obsoletes.owl
# 'all' tolerates an inferred equivalence between two imported classes
# (FOODON:02010014 'animal blood' == UBERON:0000178 'blood') that base merging
# surfaces; no ECTO term is involved. See the merged_import override in
# ecto.Makefile, which strips imported disjointness axioms for the same reason.
allow_equivalents: all
robot_report:
  fail_on : ERROR
  use_labels : False
  report_on :
    - ecto-base.owl
